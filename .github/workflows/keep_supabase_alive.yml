name: Keep Supabase Awake & Discord Notifier

on:
  schedule:
    # Jalankan otomatis setiap 3 hari sekali jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Bisa dipicu manual dari tab Actions di GitHub

jobs:
  ping-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ping Supabase & Send Discord Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python .github/scripts/ping_supabase.py
